<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería nocturna | NOCTURNA</title>

    <style>
        body {
            margin: 0;
            background-color: #100e10;
            color: #e9dfcf;
            font-family: Georgia, serif;
        }

        header {
            text-align: center;
            padding: 50px 20px 25px;
        }

        h1 {
            color: #e9dfcf;
            font-size: 42px;
            letter-spacing: 4px;
        }

        header p {
            color: #aaa0a5;
            font-style: italic;
        }

        .volver {
            display: inline-block;
            margin-top: 20px;
            color: #e9dfcf;
            text-decoration: none;
            border: 1px solid #702638;
            padding: 10px 20px;
            transition: 0.3s;
        }

        .volver:hover {
            background-color: #702638;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 35px;
            max-width: 1100px;
            margin: auto;
        }

        .imagen {
            position: relative;
            overflow: hidden;
            border: 1px solid #702638;
            height: 280px;
        }

        .imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(65%);
            transition: 0.4s ease;
        }

        .imagen:hover img {
            transform: scale(1.08);
            filter: grayscale(0%);
        }

        .imagen span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 0;
            text-align: center;
            background: rgba(16, 14, 16, 0.85);
            color: #e9dfcf;
        }
    </style>
</head>

<body>

    <header>
        <h1>Galería nocturna</h1>
        <p>Un recorrido visual por la estética y el imaginario gótico</p>
        <a href="subcultura-gotica index.html" class="volver">← Volver a NOCTURNA</a>
    </header>

    <main class="galeria">
        <div class="imagen">
            <img src="castillo gotico.jpg" alt="Castillo gótico">
            <span>Arquitectura gótica</span>
        </div>

        <div class="imagen">
            <img src="moda gotica.jpg" alt="Moda gótica">
            <span>Moda y estética</span>
        </div>

        <div class="imagen">
            <img src="arte gotico.jpg" alt="Arte oscuro">
            <span>Arte y simbolismo</span>
        </div>

        <div class="imagen">
            <img src="paisaje nocturno.jpg" alt="Paisaje nocturno">
            <span> paisajes nocturnos</span>
        </div>
    </main>

</body>
</html>
